<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero Considerations — Beta</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Join the Zero Considerations Android beta.">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 2rem 1.25rem; min-height: 100vh; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      background: #101418; color: #e8eaed;
    }
    h1 { font-size: 1.4rem; margin: 0 0 .3rem; letter-spacing: .04em; }
    .sub { margin: 0 0 1.2rem; color: #9aa3ab; font-size: .9rem; }
    .step {
      width: 19rem; max-width: 92vw; margin: .5rem auto; padding: .9rem;
      border-radius: .7rem; background: #171d23; border: 1px solid #2a323b;
    }
    .step h2 { font-size: .9rem; margin: 0 0 .6rem; color: #e8eaed; font-weight: 600; }
    .btn {
      display: block; text-align: center; padding: .8rem 1rem; border-radius: .6rem;
      text-decoration: none; font-weight: 600; font-size: .95rem;
      background: #e8eaed; color: #101418;
    }
    .code {
      display: block; text-align: center; font-family: ui-monospace, Consolas, monospace;
      font-size: 1rem; letter-spacing: .06em; padding: .65rem .5rem; margin: 0 0 .6rem;
      border-radius: .5rem; background: #0b0e11; border: 1px dashed #3a434c; color: #e8eaed;
      user-select: all; word-break: break-all;
    }
    .fine { font-size: .78rem; color: #6b747d; margin-top: 1.3rem; }
    .fine a { color: #9aa3ab; }
  </style>
</head>
<body>
  <h1>ZERO CONSIDERATIONS BETA</h1>
  <p class="sub">Three taps, in order — same Google account for all three.</p>

  <div class="step">
    <h2>1 · Become a tester</h2>
    <a class="btn" href="https://play.google.com/apps/testing/com.zeroconsiderations.mobile">Join the test</a>
  </div>

  <!-- Visible without JS so the numbering never gaps; JS upgrades it in place
       with the personal code from ?c= (codes never live in this page). -->
  <div class="step">
    <h2>2 · Redeem your code</h2>
    <span class="code" id="codeText" hidden></span>
    <a class="btn" id="redeemBtn" href="https://play.google.com/redeem">Redeem on Google Play</a>
  </div>

  <div class="step">
    <h2>3 · Install</h2>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.zeroconsiderations.mobile">Get the app</a>
  </div>

  <p class="fine">Code shows as $0 at checkout after redeeming.<br>
    iPhone? Use <a href="https://testflight.apple.com/join/mzpWTVKy">TestFlight</a> instead. · <a href="/privacy.html">Privacy</a></p>

  <script>
    (function () {
      var m = /[?&]c=([A-Za-z0-9]{8,32})\b/.exec(location.search);
      if (m) {
        var code = m[1];
        var el = document.getElementById('codeText');
        el.textContent = code;
        el.hidden = false;
        document.getElementById('redeemBtn').href =
          'https://play.google.com/redeem?code=' + encodeURIComponent(code);
      }
    })();
  </script>
</body>
</html>
