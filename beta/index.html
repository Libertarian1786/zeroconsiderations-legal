<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero Considerations — the beta has ended</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="The Zero Considerations Android beta has ended — the app is live on Google Play.">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 2rem 1.25rem; min-height: 100vh; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      background: #101418; color: #e8eaed;
    }
    h1 { font-size: 1.3rem; letter-spacing: .04em; margin: 0 0 .4rem; }
    p { max-width: 26rem; color: #9aa3ab; line-height: 1.5; margin: .4rem 0 1.2rem; }
    .btn {
      display: block; width: 16rem; max-width: 90vw; padding: .9rem 1rem;
      border-radius: 10px; background: #3DDC84; color: #101418; font-weight: 700;
      text-decoration: none;
    }
    .fine { font-size: .8rem; margin-top: 1.4rem; }
    .fine a { color: #9aa3ab; }
  </style>
  <script>
    // The closed beta is over. Old beta links forward straight to the store.
    (function () {
      if (/Android/.test(navigator.userAgent || '')) {
        location.replace('https://play.google.com/store/apps/details?id=com.zeroconsiderations.mobile');
      }
    })();
  </script>
</head>
<body>
  <h1>THE BETA HAS ENDED</h1>
  <p>Zero Considerations is live on Google Play — $9.99 one-time, no subscription.
     Beta testers: your installed app updates to the release version automatically.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.zeroconsiderations.mobile">Get it on Google&nbsp;Play</a>
  <p class="fine">On iPhone? It's on the
    <a href="https://apps.apple.com/app/id6792565250">App&nbsp;Store</a>.
    &middot; <a href="/privacy.html">Privacy</a></p>
</body>
</html>
