<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get Zero Considerations</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Zero Considerations — offline firearm zeroing and ballistics. Photograph your target, get your turret clicks.">
  <meta property="og:image" content="https://zeroconsiderations.com/store-assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 2rem 1.25rem; min-height: 100vh; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      background: #101418; color: #e8eaed;
    }
    h1 { font-size: 1.5rem; margin: 0 0 .4rem; letter-spacing: .04em; }
    p  { margin: .3rem 0 1.4rem; color: #9aa3ab; max-width: 30rem; }
    .btn {
      display: block; width: 16rem; max-width: 90vw; margin: .5rem auto; padding: .9rem 1rem;
      border-radius: .6rem; text-decoration: none; font-weight: 600; font-size: 1rem;
      background: #e8eaed; color: #101418;
    }
    .btn.secondary { background: #232a31; color: #e8eaed; border: 1px solid #3a434c; }
    .fine { font-size: .78rem; color: #6b747d; margin-top: 1.6rem; }
    .fine a { color: #9aa3ab; }
  </style>
  <script>
    // Printed/displayed QR for the "club" venue lands here. The page — not
    // the QR — decides where to send the visitor, so store URLs and tags can
    // change forever without reprinting anything. Auto-forward on phones; on
    // anything ambiguous (desktop, tablets, unknown UA) show both buttons.
    (function () {
      var ua = navigator.userAgent || '';
      var ios = /iPhone|iPod/.test(ua);
      var android = /Android/.test(ua);
      // qr_target Play custom listing + referrer tag, per
      // zc_marketing_push_2026-09-07/store_custom_listings.md Part A.
      var APPLE = 'https://apps.apple.com/app/id6792565250?ct=club&mt=8';
      var PLAY  = 'https://play.google.com/store/apps/details?id=com.zeroconsiderations.mobile&listing=qr_target&referrer=utm_source%3Drange%26utm_medium%3Dqr%26utm_campaign%3Dtargets_fall26%26utm_content%3Dclub';
      if (ios) location.replace(APPLE);
      else if (android) location.replace(PLAY);
    })();
  </script>
</head>
<body>
  <h1>ZERO CONSIDERATIONS</h1>
  <p>You just scanned this at a club sight-in day. Photograph your target and Zero Considerations gives you the exact turret clicks. No account, no tracking, works with no signal.</p>
  <a class="btn" href="https://apps.apple.com/app/id6792565250?ct=club&amp;mt=8">iPhone — App&nbsp;Store</a>
  <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.zeroconsiderations.mobile&amp;listing=qr_target&amp;referrer=utm_source%3Drange%26utm_medium%3Dqr%26utm_campaign%3Dtargets_fall26%26utm_content%3Dclub">Android — Google&nbsp;Play</a>
  <p class="fine">$9.99 one-time on either store &mdash; no subscription.
    &middot; <a href="/privacy.html">Privacy</a></p>
</body>
</html>
